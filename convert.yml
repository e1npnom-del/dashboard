name: แปลง XLSX → CSV

on:
  push:
    paths:
      - 'event_outage_data.xlsx'
  workflow_dispatch:    # รันแบบ manual ได้จากหน้า Actions

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install openpyxl

      - name: แปลง xlsx → csv
        run: python convert_xlsx.py

      - name: Commit csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add event_outage_data.csv
          git diff --cached --quiet || git commit -m "auto: แปลง xlsx → csv"
          git push
